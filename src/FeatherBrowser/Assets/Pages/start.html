<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>New Tab</title>
    <style>
      __PAGE_STYLES__
    </style>
  </head>
  <body>
    <main class="newtab">
      <form id="search" class="searchbox" role="search">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5"></circle>
          <path d="m16 16 4 4"></path>
        </svg>
        <input
          id="q"
          aria-label="Search the web or enter an address"
          autocomplete="off"
          spellcheck="false"
          placeholder="Search with __SEARCH_ENGINE__ or enter an address"
        />
        <button class="sr-only" type="submit">Search</button>
      </form>

      <section class="shortcut-section" aria-label="Shortcuts">
        <div id="quick-links" class="quicklinks"></div>
      </section>

      <section class="continue-section" aria-labelledby="continue-title">
        <div class="section-heading">
          <h2 id="continue-title">Recent</h2>
          <button id="history-link" class="link-button" type="button">History</button>
        </div>
        <div id="recent-grid" class="recent-grid">
          <div class="recent-placeholder">Your recent pages will show up here.</div>
        </div>
      </section>
    </main>

    <div class="customize-wrap">
      <div id="customize-panel" class="customize-panel" hidden>
        <button id="edit-links" class="customize-row" type="button"><span>Edit shortcuts</span></button>
        <button class="customize-row" type="button" data-action="open-settings"><span>Settings</span></button>
        <button class="customize-row" type="button" data-action="open-favorites-library"><span>Favorites</span></button>
        <div class="customize-divider"></div>
        <button id="memory-toggle" class="toggle-row" type="button" role="switch" aria-checked="false" data-action="toggle-memory">
          <span>Memory saver</span><i></i>
        </button>
        <button id="shield-toggle" class="toggle-row" type="button" role="switch" aria-checked="false" data-action="toggle-shield">
          <span>Feather Shield</span><i></i>
        </button>
      </div>

      <button id="customize-button" class="customize-button" type="button" aria-expanded="false" aria-label="Customize">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m4 20 4.2-1 10.6-10.6a2.2 2.2 0 0 0-3.1-3.1L5.1 15.9 4 20Z"></path>
          <path d="m13.8 7.2 3 3"></path>
        </svg>
        <span>Customize</span>
      </button>
    </div>

    <dialog id="shortcut-dialog">
      <form id="shortcut-form">
        <div class="dialog-heading">
          <h2 id="dialog-title">Add shortcut</h2>
          <button type="button" id="close-dialog" class="dialog-close" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
          </button>
        </div>

        <label>Name<input id="shortcut-name" maxlength="32" required autocomplete="off" placeholder="GitHub" /></label>
        <label>Website<input id="shortcut-url" maxlength="2048" required autocomplete="off" placeholder="https://github.com" /></label>

        <p id="shortcut-error" role="alert"></p>

        <div class="dialog-actions">
          <button type="button" id="delete-link" class="danger">Delete</button>
          <button type="button" id="cancel-link">Cancel</button>
          <button type="submit" class="primary">Save</button>
        </div>
      </form>
    </dialog>

    <div id="toast" role="status" aria-live="polite"></div>
    <script>
      __PAGE_SCRIPT__;
    </script>
  </body>
</html>
