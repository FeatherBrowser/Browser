# trunk-ignore-all(pinact/config-error)
name: Stable release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: feather-release
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.find.outputs.version }}

    steps:
      - name: Find vMAJOR.MINOR.PATCH in commit messages
        id: find
        shell: pwsh
        run: |
          $event = Get-Content $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $version = $null

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -match '^v(?<version>\d+\.\d+\.\d+)$') {
              $version = $Matches['version']
            }
          }
          else {
            # Every commit in the push, oldest first; the newest version mention wins.
            $messages = @($event.commits | ForEach-Object { $_.message })
            if ($messages.Count -eq 0 -and $event.head_commit) {
              $messages = @($event.head_commit.message)
            }

            foreach ($message in $messages) {
              $found = [regex]::Matches(
                $message,
                '(?<![\w.])[vV](?<version>\d+\.\d+\.\d+)(?![\w.]*\d)')
              if ($found.Count -gt 0) {
                $version = $found[$found.Count - 1].Groups['version'].Value
              }
            }
          }

          if ($version) {
            Write-Host "Release version detected: v$version"
          }
          else {
            Write-Host 'No vMAJOR.MINOR.PATCH found; skipping release.'
          }

          "version=$version" >> $env:GITHUB_OUTPUT

  release:
    needs: detect
    if: needs.detect.outputs.version != ''
    runs-on: windows-latest

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.detect.outputs.version }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Verify version matches project version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "src/FeatherBrowser/FeatherBrowser.csproj" -Raw
          $projectVersion = $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()

          if ($env:RELEASE_VERSION -ne $projectVersion) {
            throw "Release version $env:RELEASE_VERSION does not match project version $projectVersion."
          }

      - name: Build
        run: ./scripts/build.ps1
        shell: pwsh

      - name: Checks
        run: ./scripts/check.ps1
        shell: pwsh

      - name: Publish Windows x64
        run: ./scripts/publish.ps1 -Runtime win-x64 -SelfContained
        shell: pwsh

      - name: Verify FeatherFilters publish output
        shell: pwsh
        run: |
          $filters = Get-ChildItem -Path "artifacts" -Recurse -Filter "metadata.json" |
            Where-Object { $_.FullName -match "FeatherFilters" } |
            Select-Object -First 1

          if (-not $filters) {
            throw "FeatherFilters was not included in the published application."
          }

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"

          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress

            if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup installation failed."
            }
          }

      - name: Build installer
        run: ./scripts/installer.ps1
        shell: pwsh

      - name: Check installer
        run: ./scripts/check-installer.ps1
        shell: pwsh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: FeatherBrowser-win-x64-installer
          path: artifacts/installer/*-Setup.exe
          if-no-files-found: error

      - name: Create GitHub release
        shell: pwsh
        run: ./scripts/release.ps1