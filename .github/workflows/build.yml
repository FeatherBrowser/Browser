name: Windows build and release
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
      - name: Build
        run: ./scripts/build.ps1
        shell: pwsh
      - name: Checks
        run: ./scripts/check.ps1
        shell: pwsh
      - name: Publish Windows x64
        run: ./scripts/publish.ps1 -Runtime win-x64 -SelfContained
        shell: pwsh
      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
      - name: Build installer
        run: ./scripts/installer.ps1
        shell: pwsh
      - name: Check installer installation and uninstall
        run: ./scripts/check-installer.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v7
        with:
          name: FeatherBrowser-win-x64-installer
          path: artifacts/installer/*-Setup.exe
          if-no-files-found: error

  release:
    needs: windows
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: feather-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FeatherBrowser-win-x64-installer
          path: artifacts/installer/
      - name: Create release from changelogs.md
        shell: pwsh
        run: ./scripts/release.ps1
